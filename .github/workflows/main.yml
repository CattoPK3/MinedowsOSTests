name: LiberNT Build (AMD64 Debug build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MinedowsOS
        uses: actions/checkout@v4
        with:
          repository: KRR1751/MinedowsOS
          submodules: recursive

      - name: Where am I?
        run: |
          pwd
          git remote -v
          git log --oneline -3
          ls -la | head -50
          ls -la scripts 2>&1 | head -30

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential flex bison curl xz-utils

      - name: Install RosBE
        run: |
          curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh | sh

      - name: Configure and build
        shell: bash
        run: |
          set -eo pipefail
          source "$HOME/.local/opt/rosbe/rosbe-env.sh"
          chmod +x ./configure.sh
          find scripts -type f -exec chmod +x {} +
          ./configure.sh
          ninja -C output-Clang-amd64-debug -j"$(nproc)" bootcd liberntimg

      - name: Upload bootcd.iso
        uses: actions/upload-artifact@v4
        with:
          name: LiberNT-bootcd-iso
          path: output-Clang-amd64-debug/bootcd.iso
          if-no-files-found: error
          compression-level: 0

      - name: Upload LiberNT.img
        uses: actions/upload-artifact@v4
        with:
          name: LiberNT-disk-image
          path: output-Clang-amd64-debug/LiberNT.img
          if-no-files-found: error
          compression-level: 0
