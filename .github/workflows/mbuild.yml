name: Manual Build (AMD64 Debug build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential flex bison curl xz-utils

      - name: Install RosBE
        run: |
          curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh | sh
          
      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-libernt-${{ github.run_id }}
          restore-keys: ccache-libernt-

      - name: Configure and build
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_SLOPPINESS: pch_defines,time_macros
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -eo pipefail
          source "$HOME/.local/opt/rosbe/rosbe-env.sh"

          ./configure.sh
          ninja -C output-Clang-amd64-debug -j"$(nproc)" bootcd liberntimg
          
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-libernt-${{ github.run_id }}

      - name: Upload bootcd.iso
        uses: actions/upload-artifact@v4
        with:
          name: LiberNT-bootcd-iso
          path: output-Clang-amd64-debug/bootcd.iso
          if-no-files-found: error
          compression-level: 0

      - name: Upload LiberNT.img
        uses: actions/upload-artifact@v4
        with:
          name: LiberNT-disk-image
          path: output-Clang-amd64-debug/LiberNT.img
          if-no-files-found: error
          compression-level: 0
